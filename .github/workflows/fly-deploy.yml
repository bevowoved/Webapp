name: Deploy Preprod

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-preprod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-preprod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Preprod
        run: flyctl deploy --app mauria-preprod --config fly.preprod.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Smoke test healthz
        run: |
          for i in $(seq 1 10); do
            if curl -fsS --max-time 5 https://mauria-preprod.fly.dev/healthz; then
              echo "healthz OK"
              exit 0
            fi
            sleep 5
          done
          echo "healthz did not become ready" >&2
          exit 1
