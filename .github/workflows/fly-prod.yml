name: Deploy Prod (Manual)

on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Prod
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Smoke test healthz
        run: |
          for i in $(seq 1 10); do
            if curl -fsS --max-time 5 https://app.mauria.fr/healthz; then
              echo "healthz OK"
              exit 0
            fi
            sleep 5
          done
          echo "healthz did not become ready" >&2
          exit 1

      - name: Purge cache
        if: success()
        uses: jakejarvis/cloudflare-purge-action@v0.3.0
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          PURGE_URLS: '["https://app.mauria.fr/", "https://app.mauria.fr/index.html", "https://app.mauria.fr/manifest.webmanifest", "https://app.mauria.fr/sw.js"]'
