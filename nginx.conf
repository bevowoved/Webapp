load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_http_brotli_static_module.so;

worker_processes auto;
worker_rlimit_nofile 8192;
pid /run/nginx/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    charset utf-8;

    sendfile on;
    sendfile_max_chunk 512k;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    etag on;

    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;

    brotli on;
    brotli_static on;
    brotli_comp_level 6;
    brotli_min_length 256;
    brotli_types text/plain text/css text/xml text/javascript application/javascript application/json application/manifest+json application/wasm application/xml image/svg+xml font/woff font/woff2;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/manifest+json application/wasm application/xml image/svg+xml font/woff font/woff2;

    client_body_temp_path /tmp/nginx-client-body;
    client_max_body_size 1m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    map $uri $cache_control {
        default                    "no-cache";
        /healthz                   "";
        /sw.js                     "no-cache, no-store, must-revalidate";
        /manifest.webmanifest      "no-cache, no-store, must-revalidate";
        ~^/assets/                 "public, max-age=31536000, immutable";
        ~*\.(?:js|mjs|css|wasm|json|ico|png|jpg|jpeg|gif|svg|webp|avif|woff2?|ttf|otf|eot|mp3|wav|ogg|map)$ "public, max-age=604800, stale-while-revalidate=86400";
    }

    map $uri $link_header {
        default                    "__LINK__";
        /healthz                   "";
        /sw.js                     "";
        /manifest.webmanifest      "";
        ~^/assets/                 "";
        ~*\.(?:js|mjs|css|wasm|json|ico|png|jpg|jpeg|gif|svg|webp|avif|woff2?|ttf|otf|eot|mp3|wav|ogg|map)$ "";
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header Cache-Control $cache_control always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://mauria-api.fly.dev https://*.ingest.sentry.io; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        add_header Link $link_header always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

        location = /healthz { access_log off; default_type text/plain; return 200 "ok"; }
        location = /sw.js { try_files $uri =404; }
        location = /manifest.webmanifest { default_type application/manifest+json; try_files $uri =404; }
        location ^~ /assets/ {
            location ~* \.(?:br|gz)$ { return 404; }
            try_files $uri =404;
        }
        location ~* \.(?:js|mjs|css|wasm|json|ico|png|jpg|jpeg|gif|svg|webp|avif|woff2?|ttf|otf|eot|mp3|wav|ogg|map)$ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
