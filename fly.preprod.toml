app = 'mauria-preprod'
primary_region = 'cdg'

[build]

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '5s'
    interval = '15s'
    method = 'GET'
    timeout = '3s'
    path = '/healthz'

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 20
    hard_limit = 25

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
